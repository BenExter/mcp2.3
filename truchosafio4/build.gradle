plugins { id 'fabric-loom' version '1.7.4'; id 'maven-publish' }
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories {
    maven { name = 'GeckoLib'; url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "software.bernie.geckolib:geckolib-fabric-1.21.1:${project.geckolib_version}"
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }

tasks.register('validateResources', Exec) {
    commandLine 'python3', 'VALIDAR_RECURSOS.py'
}
tasks.named('check') { dependsOn 'validateResources' }
tasks.register('geckoResourceTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.truchosafio4.resources.GeckoResourceTest'
}
tasks.named('check') { dependsOn 'geckoResourceTest' }

// Explicit opt-in integration test mod; never included in the distributable main JAR.
sourceSets {
    smoke {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + sourceSets.main.runtimeClasspath
    }
}
loom {
    mods {
        truchosafio4 { sourceSet sourceSets.main }
        truchosafio4_smoketest { sourceSet sourceSets.smoke }
    }
    runs {
        smokeServer {
            server()
            name 'Truchosafio4 dedicated server smoke tests'
            source sourceSets.smoke
            runDir 'run-smoke'
            vmArg '-Dtruchosafio4.smoke=true'
            programArg 'nogui'
        }
    }
}

tasks.named('runSmokeServer') {
    doFirst { delete 'run-smoke/SMOKE_PASS.txt', 'run-smoke/SMOKE_FAIL.txt' }
    doLast {
        if (!file('run-smoke/SMOKE_PASS.txt').exists() || file('run-smoke/SMOKE_FAIL.txt').exists()) {
            throw new GradleException('Flashbang dedicated-server smoke assertions failed; inspect server log')
        }
    }
}
tasks.register('validateDeliveryJar', Exec) {
    dependsOn remapJar
    commandLine 'python3', 'tools/validar_jar.py'
}
tasks.named('check') { dependsOn 'validateDeliveryJar' }
